name: Portable handoff checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_portable_handoff
      - run: python -m compileall -q gpd isaac_task scripts tests
      - run: bash -n isaac.sh gallop.sh setup_isaac.sh
